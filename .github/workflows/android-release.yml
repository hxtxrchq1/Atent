name: Atent Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/android/**'
      - 'apps/safety-web/**'
      - 'packages/**'
      - '.github/workflows/android-release.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-apk:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4


      - name: Install Dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Build web application
        run: npm run build --workspace=@atent/safety-web

      - name: Package web application into Android assets
        run: |
          rm -rf apps/mobile/android/app/src/main/assets/www
          mkdir -p apps/mobile/android/app/src/main/assets/www
          cp -R apps/safety-web/dist/. apps/mobile/android/app/src/main/assets/www/
          mkdir -p apps/mobile/android/app/src/main/assets/www/assets/character
          cp apps/safety-web/public/assets/character/* apps/mobile/android/app/src/main/assets/www/assets/character/

      - name: Configure Firebase for background push
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/android/app/google-services.json
            echo "Firebase config injected for FCM."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret missing; APK will not have FCM push registration enabled."
          fi

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          for attempt in 1 2 3; do
            bash ./gradlew --no-daemon assembleDebug && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build failed (possibly a transient repository rate limit); retrying in 20 seconds..."
              sleep 20
            fi
          done
          exit 1

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atent-android-v1.9.6-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
