<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09080D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Atent te ayuda a mantenerte en contacto con tu red de confianza.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Atent — Seguridad personal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }
    input, textarea {
      user-select: auto;
      -webkit-user-select: auto;
    }
    body {
      background-color: #09080D;
      color: #F8F5F8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      touch-action: pan-y;
      min-height: 100%;
      height: 100%;
      overscroll-behavior: none;
    }
    html { height: 100%; overflow: hidden; }
    #root { height: 100dvh; min-height: 0; overflow: hidden; }
    @keyframes floatCharacter {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-6px) rotate(1.2deg);
      }
    }
    @keyframes floatSpeechBubble {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-4px) scale(1.02);
      }
    }
    .atent-floating-character {
      animation: floatCharacter 4s ease-in-out infinite;
    }
    .atent-floating-bubble {
      animation: floatSpeechBubble 3.2s ease-in-out infinite;
    }
  </style>
  <!-- MapLibre GL + OpenStreetMap: mapa libre sin API key -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css" crossorigin="anonymous" />
  <script src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
