version: '3.8'

services:
  # Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: atent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atent_user
      POSTGRES_PASSWORD: local_dev_password_only
      POSTGRES_DB: atent_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atent_user -d atent_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Ephemeral Cache and Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: atent-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
